name: Deploy DCG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dcg-main
  cancel-in-progress: false

jobs:
  deploy:
    uses: jamesqo/gha-workflows/.github/workflows/rust-cli-deploy.yml@v2
    with:
      binary: dcg
      rust-toolchain: stable
      cache-prefix: dcg
      linux-target: x86_64-unknown-linux-musl
      timeout-minutes: 10
      deploy-targets: >-
        [{"ssh":"james@100.97.52.20","platform":"linux-amd64"},{"ssh":"jko@100.102.58.41","platform":"darwin-arm64"},{"ssh":"james@100.90.2.48","platform":"darwin-arm64"}]
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
