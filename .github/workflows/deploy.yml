name: Deploy DCG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dcg-main
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: dcg-v1
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl,aarch64-apple-darwin

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dcg-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Restore macOS SDK cache
        id: macos-sdk-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/MacOSX26.1.sdk.tar.xz
          key: dcg-macos-sdk-26.1-beee7212d265a6d2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-zigbuild@0.23.0
          fallback: none

      - name: Test
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build Linux binary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --locked --release --target x86_64-unknown-linux-musl
          mkdir -p dist/linux-amd64 dist/darwin-arm64
          cp target/x86_64-unknown-linux-musl/release/dcg dist/linux-amd64/dcg
          file dist/linux-amd64/dcg | tee /dev/stderr | grep -q 'x86-64'
          dist/linux-amd64/dcg --version

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.97.52.20,100.102.58.41,100.90.2.48

      - name: Configure deployment SSH key
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Acquire macOS SDK
        if: steps.macos-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/MacOSX26.1.sdk.tar.xz"
          curl --fail --location --retry 3 \
            --output "$sdk_archive" \
            https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz
          printf '%s  %s\n' \
            beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c \
            "$sdk_archive" \
            | sha256sum --check --strict

      - name: Save macOS SDK cache
        if: steps.macos-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/MacOSX26.1.sdk.tar.xz
          key: dcg-macos-sdk-26.1-beee7212d265a6d2

      - name: Cross-compile Apple Silicon binary
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/MacOSX26.1.sdk"
          mkdir -p "$sdk_root"
          tar -xJf "$RUNNER_TEMP/MacOSX26.1.sdk.tar.xz" \
            --strip-components=1 \
            -C "$sdk_root"

          SDKROOT="$sdk_root" \
          MACOSX_DEPLOYMENT_TARGET=13.4 \
          CARGO_TARGET_DIR="$PWD/target-macos" \
            cargo zigbuild --locked --release --target aarch64-apple-darwin
          cp target-macos/aarch64-apple-darwin/release/dcg dist/darwin-arm64/dcg
          file dist/darwin-arm64/dcg | tee /dev/stderr | grep -q 'arm64'
          sha256sum dist/linux-amd64/dcg dist/darwin-arm64/dcg

      - name: Show compiler cache statistics
        run: sccache --show-stats

      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dcg-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

      - name: Deploy over Tailscale
        shell: bash
        run: |
          set -euo pipefail

          deploy() {
            local target=$1
            local platform=$2
            local staged=".local/bin/.dcg-${GITHUB_SHA}"

            ssh "$target" 'mkdir -p "$HOME/.local/bin"'
            scp "dist/${platform}/dcg" "${target}:${staged}"

            # Send the script over stdin and pass the generated staging path as
            # an actual positional argument to the remote shell.
            ssh "$target" sh -s -- "$staged" <<'REMOTE_SCRIPT'
              set -eu
              staged=$1
              chmod 0755 "$HOME/$staged"
              "$HOME/$staged" --version
              "$HOME/$staged" test "git status" >/dev/null
              mv -f "$HOME/$staged" "$HOME/.local/bin/dcg"
          REMOTE_SCRIPT
          }

          deploy james@100.97.52.20 linux-amd64
          deploy jko@100.102.58.41 darwin-arm64
          deploy james@100.90.2.48 darwin-arm64
