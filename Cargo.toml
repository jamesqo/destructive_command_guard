[package]
name = "destructive_command_guard"
version = "0.14.0"
edition = "2024"
rust-version = "1.95"
description = "A small hook that blocks destructive shell commands"
license-file = "LICENSE"
repository = "https://github.com/jamesqo/destructive_command_guard"
autotests = false
autobenches = false
build = false
exclude = [".beads/", ".codex/", ".config/", ".github/", "AGENTS.md"]

[[bin]]
name = "dcg"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
